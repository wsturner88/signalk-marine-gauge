; SignalK Marine Gauge — Waveshare ESP32-S3-Touch-LCD-4 (plain -4, rev V2+)
; Board: ESP32-S3 (N16R8) — 16MB flash, 8MB OCTAL PSRAM, MAC 58:e6:c5:72:3b:c0
; Confirmed hardware (I2C scan 2026-06-13): merged I2C on SDA15/SCL7;
;   TCA9554/PCA9554 IO expander @0x24, GT911 touch @0x5D, PCF85063 RTC @0x51.
;
; Two build targets:
;   env:scan    — minimal I2C bus scanner (variant probe). `pio run -e scan -t upload`
;   env:display — Waveshare LVGL widgets demo: lights the ST7701 panel + GT911 touch.
;                 `pio run -e display -t upload`

[env]
; pioarduino platform pinned to Arduino core 3.3.2 / ESP-IDF 5.5.1 — matches the
; Waveshare V4 demo's "Arduino-v3.3.2" environment. The stock platformio/espressif32
; ships core 3.0.17 (IDF 5.1), whose esp_lcd/SPI structs lack fields Arduino_GFX 1.5.3
; needs (clock_source, refresh_on_demand) → compile errors. This release fixes that.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
board_build.flash_size = 16MB
; N16R8 = octal (OPI) PSRAM — required for the 480x480 RGB framebuffer
board_build.arduino.memory_type = qio_opi
; Native USB-Serial/JTAG: route Serial/USBSerial over USB CDC
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

[env:scan]
build_src_filter = +<scan/>

; Emergency buzzer silence — drives all expander pins low.
[env:silence]
build_src_filter = +<silence/>

; Buzzer-identification sweep (display stays on; cycles CH422G OC control values).
[env:buzztest]
build_src_filter = +<buzztest/>
lib_extra_dirs = ../vendor/waveshare-demo/examples/Arduino-v3.3.2/libraries
build_flags =
    ${env.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

[env:display]
build_src_filter = +<display/>
; Pull the Waveshare-bundled, version-matched libraries (Arduino_GFX 1.5.3, LVGL 8.4.0,
; SensorLib for GT911). Kept under vendor/ so versions are pinned to the known-good demo.
lib_extra_dirs = ../vendor/waveshare-demo/examples/Arduino-v3.3.2/libraries
build_flags =
    ${env.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

; Our app: WiFi -> SignalK WebSocket -> LVGL boat-health panel.
[env:app]
build_src_filter = +<app/>
lib_extra_dirs = ../vendor/waveshare-demo/examples/Arduino-v3.3.2/libraries
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    links2004/WebSockets@^2.6.1
build_flags =
    ${env.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include
